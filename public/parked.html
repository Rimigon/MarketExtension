<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>PriceWatch · фоновое обновление</title>
  <!--
    Listed *before* the rest of the head so Chrome adopts our manifest the
    moment it starts parsing — that prevents it from falling back to the
    previous navigation's manifest (e.g. wildberries.ru's PWA), which was
    spamming the console with `android-icon-144x144.png` 404s.
  -->
  <link rel="manifest" href="parked.webmanifest">
  <link rel="icon" type="image/png" sizes="16x16" href="public/icons/icon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="public/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="public/icons/icon-48.png">
  <link rel="icon" type="image/png" sizes="128x128" href="public/icons/icon-128.png">
  <link rel="apple-touch-icon" href="public/icons/icon-128.png">
  <link rel="mask-icon" href="public/icons/icon.svg" color="#0ea5e9">
  <style>
    html,body{margin:0;height:100%;}
    body{
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      background:#f8fafc;color:#475569;
      display:flex;align-items:center;justify-content:center;
      font-size:13px;text-align:center;padding:16px;
    }
    .wrap{max-width:420px;}
    img{width:48px;height:48px;display:block;margin:0 auto 14px;opacity:.95;}
    h1{font-size:14px;font-weight:600;margin:0 0 6px;color:#0f172a;}
    p{margin:0;color:#64748b;line-height:1.5;}
  </style>
</head>
<body>
  <div class="wrap">
    <img src="public/icons/icon-128.png" alt="PriceWatch">
    <h1>PriceWatch — фоновая вкладка</h1>
    <p>Эта вкладка используется расширением для тихого обновления цен. Можно закрыть — она пересоздастся при следующем обновлении.</p>
  </div>
</body>
</html>
