<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" shape-rendering="crispEdges">
  <!-- Receipt aesthetic: charcoal stamp with a descending step-chart in paper.
       The red marker on the final step is the only colour the mark raises its
       voice for — price-drop signal. -->
  <rect width="128" height="128" fill="#121212"/>
  <path
    d="M 12 36 L 44 36 L 44 60 L 76 60 L 76 84 L 110 84"
    stroke="#F5F5F0"
    stroke-width="14"
    fill="none"
    stroke-linejoin="miter"
    stroke-linecap="square"
  />
  <rect x="98" y="72" width="24" height="24" fill="#E63946"/>
</svg>
